<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>ScriptFlow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#f5f2ea;
  --surface:#fffefa;
  --surface-2:#faf7ef;
  --ink:#1c1a15;
  --muted:#6e685a;
  --faint:#918a78;
  --border:#e3dccd;
  --border-strong:#cfc6b1;
  --primary:#1d5d57;
  --on-primary:#ffffff;
  --primary-ink:#0f3b37;
  --primary-wash:#e2eeeb;
  --marker:#a8600f;
  --marker-wash:#fbeed3;
  --speak-wash:#fdf2cd;
  --ok:#2f6b46;
  --ok-wash:#e2efe6;
  --danger:#8f3320;
  --shadow:0 1px 2px rgba(28,26,21,.06), 0 8px 24px -16px rgba(28,26,21,.28);
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:ui-sans-serif, system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#131310;
    --surface:#1e1d18;
    --surface-2:#191814;
    --ink:#ece7da;
    --muted:#a29b88;
    --faint:#867f6d;
    --border:#332f26;
    --border-strong:#464034;
    --primary:#63b8ab;
    --on-primary:#10231f;
    --primary-ink:#9ad6cb;
    --primary-wash:#1a2f2c;
    --marker:#d79a4e;
    --marker-wash:#2f2618;
    --speak-wash:#302713;
    --ok:#6fb98a;
    --ok-wash:#1b2b21;
    --danger:#dd8b74;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --on-primary:#10231f;
  --paper:#131310;
  --surface:#1e1d18;
  --surface-2:#191814;
  --ink:#ece7da;
  --muted:#a29b88;
  --faint:#867f6d;
  --border:#332f26;
  --border-strong:#464034;
  --primary:#63b8ab;
  --primary-ink:#9ad6cb;
  --primary-wash:#1a2f2c;
  --marker:#d79a4e;
  --marker-wash:#2f2618;
  --speak-wash:#302713;
  --ok:#6fb98a;
  --ok-wash:#1b2b21;
  --danger:#dd8b74;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.shell{min-height:100%;display:flex;flex-direction:column}
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar-in{
  max-width:820px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;gap:10px;
}
.brand{
  display:flex;align-items:baseline;gap:7px;
  font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:-.01em;
  white-space:nowrap;flex-shrink:0;
}
.brand .dot{
  width:8px;height:8px;border-radius:50%;background:var(--marker);
  display:inline-block;flex:none;translate:0 -2px;
}
.nav{margin-left:auto;display:flex;gap:2px;flex-shrink:0}
.nav button{
  padding:6px 11px;border-radius:999px;font-size:13px;color:var(--muted);
  white-space:nowrap;transition:background .15s,color .15s;
}
.nav button:hover{color:var(--ink);background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--primary);color:var(--on-primary)}
main{flex:1;max-width:820px;width:100%;margin:0 auto;padding-block:24px 40px;padding-inline:16px}
.wide{max-width:820px}

/* ---------- type ---------- */
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,5.2vw,36px);letter-spacing:-.02em}
h2{font-size:19px}
h3{font-size:16px}
.lede{color:var(--muted);font-size:15px;line-height:1.8}
.eyebrow{
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);font-weight:600;
}
.num{font-variant-numeric:tabular-nums}
.en{font-family:var(--serif);letter-spacing:.005em}

/* ---------- pieces ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 9px;border-radius:999px;font-size:11.5px;
  border:1px solid var(--border);color:var(--muted);white-space:nowrap;
}
.chip.lvl{background:var(--primary-wash);color:var(--primary-ink);border-color:transparent;font-weight:600}
.chip.k-listening{background:var(--primary-wash);color:var(--primary-ink);border-color:transparent}
.chip.k-vocab{background:var(--marker-wash);color:var(--marker);border-color:transparent}
.chip.k-grammar{background:var(--speak-wash);color:var(--marker);border-color:transparent}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:10px;font-size:14px;font-weight:600;
  background:var(--primary);color:var(--on-primary);transition:filter .15s;
}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--border-strong);font-weight:500}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{padding:6px 12px;font-size:13px}
textarea,input[type=text]{
  width:100%;padding:12px 14px;border:1px solid var(--border-strong);border-radius:12px;
  background:var(--surface);line-height:1.8;resize:vertical;
}
textarea::placeholder{color:var(--faint)}
select{
  border:1px solid var(--border);border-radius:9px;background:var(--surface);
  padding:4px 7px;font-size:12.5px;
}
.divider{height:1px;background:var(--border);border:0;margin:0}
.muted{color:var(--muted)}
.tiny{font-size:12.5px}
.note{
  border-left:3px solid var(--marker);background:var(--marker-wash);
  padding:10px 14px;border-radius:0 10px 10px 0;font-size:13px;color:var(--ink);
}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- home ---------- */
.hero{padding-block:8px 26px}
.hero h1{margin-bottom:12px}
.hero .lede{max-width:56ch}
.steps{
  display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  margin-top:22px;
}
.step{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border)}
.step .n{
  font-family:var(--serif);font-size:13px;font-weight:600;color:var(--marker);
  display:block;margin-bottom:3px;
}
.step b{display:block;font-size:14px;margin-bottom:2px}
.step span.d{font-size:12.5px;color:var(--muted);line-height:1.6}
.shelf{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin-top:14px}
.mat{
  text-align:left;display:flex;flex-direction:column;gap:8px;padding:16px;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  transition:border-color .15s, box-shadow .15s;width:100%;
}
.mat:hover{border-color:var(--border-strong);box-shadow:var(--shadow)}
.mat h3{font-size:17px}
.mat .ja{font-size:12.5px;color:var(--muted);margin-top:-4px}
.mat .sum{font-size:12.5px;color:var(--muted);line-height:1.65;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:4px;border-radius:999px;background:var(--border);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .3s}
.mat footer{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--faint);margin-top:2px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin:30px 0 6px}
.sec-head h2{font-size:17px}

/* ---------- study ---------- */
.study-head{margin-bottom:6px}
.study-head h1{font-size:clamp(22px,4.4vw,29px)}
.tabs{
  display:flex;gap:3px;border-bottom:1px solid var(--border);margin:18px 0 6px;
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:20;
  background:var(--paper);
}
.tabs button{
  padding:9px 13px;font-size:13.5px;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--marker);font-weight:600}
.tabs .count{font-size:11px;color:var(--faint);margin-left:4px}

.part{margin-top:22px}
.part-head{display:flex;gap:10px;align-items:baseline;padding:0 4px 8px}
.part-head .pn{
  font-family:var(--serif);font-size:12px;font-weight:600;color:var(--marker);
  flex:none;padding-top:2px;
}
.part-head b{font-size:14.5px;display:block}
.part-head .s{font-size:12.5px;color:var(--muted);line-height:1.6;display:block}
.sent{
  display:flex;gap:11px;padding:9px 10px;border-radius:11px;
  transition:background .15s;scroll-margin-top:120px;
}
.sent:hover{background:var(--surface-2)}
.sent.cur{background:var(--primary-wash)}
.sent.speaking{background:var(--speak-wash)}
.sent .no{
  flex:none;width:25px;height:25px;border-radius:50%;margin-top:3px;
  font-size:11.5px;font-variant-numeric:tabular-nums;
  background:var(--surface-2);border:1px solid var(--border);color:var(--muted);
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.sent:hover .no{border-color:var(--primary);color:var(--primary)}
.sent.cur .no{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.sent .body{min-width:0;flex:1}
.sent .txt{
  font-family:var(--serif);font-size:17.5px;line-height:1.85;margin:0;
  cursor:text;
}
.sent.done .txt{color:var(--muted)}
.sent .ja{font-size:13px;line-height:1.75;color:var(--muted);margin:3px 0 0}
.sent .reveal{
  font-size:12px;color:var(--faint);text-decoration:underline;
  text-underline-offset:3px;margin-top:3px;
}
.sent .reveal:hover{color:var(--ink)}
.sent .acts{flex:none;display:flex;gap:2px;align-items:flex-start;padding-top:3px}
.sent .acts button{
  padding:4px 7px;border-radius:8px;font-size:12px;color:var(--faint);
  opacity:0;transition:opacity .12s, background .12s;
}
.sent:hover .acts button,.sent .acts button:focus-visible{opacity:1}
@media (hover:none){.sent .acts button{opacity:1}}
.sent .acts button:hover{background:var(--border)}
.sent .acts .read{opacity:1;color:var(--ok);background:var(--ok-wash);font-weight:600}
.sent .marks{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sent .marks a{text-decoration:none}
::selection{background:var(--speak-wash);color:var(--ink)}

.menu{position:relative}
.pop{
  position:absolute;right:0;top:100%;margin-top:4px;z-index:50;width:min(250px,72vw);
  background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;
  box-shadow:var(--shadow);overflow:hidden;text-align:left;
}
.pop p{margin:0;padding:9px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)}
.pop button{display:block;width:100%;padding:10px 12px;text-align:left;font-size:13.5px;opacity:1!important}
.pop button:hover{background:var(--surface-2)}
.scrim{position:fixed;inset:0;z-index:45}

/* ---------- player ---------- */
.player{
  position:sticky;bottom:0;z-index:30;
  border-top:1px solid var(--border);
  background:color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter:blur(10px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.player-in{max-width:820px;margin:0 auto;padding:10px 16px}
.player .main{display:flex;align-items:center;gap:6px}
.play{
  width:42px;height:42px;border-radius:50%;background:var(--primary);color:var(--on-primary);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;
}
.skip{padding:8px 9px;border-radius:9px;color:var(--muted);font-size:12px;flex:none}
.skip:hover{background:var(--surface-2);color:var(--ink)}
.pos{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.player .opts{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;
  margin-top:9px;font-size:12px;color:var(--muted);
}
.player label{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.player input[type=checkbox]{accent-color:var(--primary);width:14px;height:14px;margin:0}
.rng{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.rng button{
  padding:2px 9px;border-radius:999px;font-size:11.5px;border:1px solid var(--border);
  color:var(--muted);white-space:nowrap;
}
.rng button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:transparent}

/* ---------- vocab / marks ---------- */
.vlist{display:grid;gap:10px;margin-top:14px}
.v{display:flex;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:13px}
.v .word{font-family:var(--serif);font-size:17px;font-weight:600}
.v .ph{font-size:12px;color:var(--faint);font-family:var(--serif)}
.v .mean{font-size:13.5px;margin-top:3px}
.v .ex{
  font-family:var(--serif);font-size:13.5px;color:var(--muted);line-height:1.7;
  margin-top:7px;padding-left:10px;border-left:2px solid var(--border);
}
.v .ex .exja{font-family:var(--sans);font-size:12.5px;display:block;margin-top:2px}
.v .side{flex:none;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.learned{background:var(--ok-wash);color:var(--ok)!important;border-color:transparent!important;font-weight:600}

.mark{padding:15px;background:var(--surface);border:1px solid var(--border);border-radius:13px;scroll-margin-top:120px}
.mark.res{opacity:.62}
.mark .q{font-family:var(--serif);font-size:15.5px;line-height:1.75;margin:8px 0 0}
.mark .hl{background:var(--speak-wash);padding:0 2px;border-radius:2px;font-weight:600}
.mark .qja{font-size:12.5px;color:var(--muted);margin:3px 0 0}
.exp{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.exp .head{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--primary-ink);margin-bottom:6px}
:root[data-theme="dark"] .exp .head{color:var(--primary)}
.exp .b{font-size:13.5px;line-height:1.85;white-space:pre-wrap}
.exp ul{margin:9px 0 0;padding-left:19px;font-size:13px;line-height:1.75}
.exp .rel{margin-top:10px;padding:9px 12px;background:var(--surface-2);border-radius:9px;font-size:13px}
.exp .rel .re{font-family:var(--serif)}
.exp .rel .rj{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--border-strong);
  border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13.5px}

/* ---------- create ---------- */
.seg{display:flex;gap:4px;margin-bottom:14px}
.seg button{padding:7px 13px;border-radius:9px;font-size:13.5px;color:var(--muted);border:1px solid transparent}
.seg button[aria-pressed="true"]{background:var(--surface);border-color:var(--border);color:var(--ink);font-weight:600}
.prog{margin-top:14px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:13.5px}
.prog ol{margin:8px 0 0;padding-left:20px;line-height:1.9;font-size:13px;color:var(--muted)}
.prog li.on{color:var(--ink);font-weight:600}
.prog li.ok{color:var(--ok)}
.err{border-left:3px solid var(--danger);background:color-mix(in srgb,var(--danger) 9%,transparent);
  padding:10px 14px;border-radius:0 10px 10px 0;font-size:13px;margin-top:12px}
@media (max-width:560px){
  .steps{grid-template-columns:1fr}
}
@media (max-width:420px){
  .sent .txt{font-size:16.5px}
  .topbar-in{padding:9px 12px;gap:6px}
  .nav button{padding:6px 9px;font-size:12.5px}
}
</style>
<div class="shell">
  <header class="topbar">
    <div class="topbar-in">
      <span class="brand"><span class="dot"></span>ScriptFlow</span>
      <nav class="nav" id="nav">
        <button type="button" data-go="home">本棚</button>
        <button type="button" data-go="create">教材をつくる</button>
        <button type="button" data-go="weakness">弱点ノート</button>
      </nav>
    </div>
  </header>
  <main id="view"></main>
  <div id="playerSlot"></div>
</div>
<script>
"use strict";
/* ============================================================
   ScriptFlow — 英文スクリプトを音読教材に変えて、つまずきを残す
   1 ファイル版。保存は localStorage、読み上げは Web Speech API、
   対訳と解説は claude.use("sample") 経由で Claude に頼む。
   ============================================================ */

/* ---------- 定数 ---------- */
const LEVEL_LABEL = {
  eiken3:"英検3級", kyotsu:"共通テスト", eiken2:"英検2級",
  toeic:"TOEIC", toefl:"TOEFL", unknown:"レベル判定なし"
};
const WEAKNESS_LABEL = {
  listening:"聞き取れない", vocab:"単語がわからない", grammar:"文法・構文がわからない"
};
const WEAKNESS_SHORT = { listening:"聞き取り", vocab:"単語", grammar:"文法" };
const KINDS = ["listening","vocab","grammar"];
const RATE_STEPS = [0.6,0.75,0.9,1.0,1.1,1.25];
const MAX_INPUT_CHARS = 20000;
const TRANSLATE_CHUNK = 20;

/* ---------- 小道具 ---------- */
const $ = (sel, root) => (root||document).querySelector(sel);
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function newId(prefix){
  const r = (crypto && crypto.randomUUID) ? crypto.randomUUID().slice(0,8)
    : Math.random().toString(36).slice(2,10);
  return prefix + "_" + Date.now().toString(36) + r;
}
function clamp(n,min,max){ return Math.min(max, Math.max(min, n)); }
function ago(ts){
  const d = Math.floor((Date.now()-ts)/86400000);
  if (d <= 0) return "今日";
  if (d === 1) return "きのう";
  if (d < 30) return d + "日前";
  return Math.floor(d/30) + "か月前";
}
function truncate(s,max){ return s.length > max ? s.slice(0,max)+"…" : s; }

/* ============================================================
   1. 保存（localStorage）
   端末の中だけに残る。読み書きは必ず try/catch で包む。
   ============================================================ */
const KEY = "scriptflow.v1";
const blank = () => ({ materials:[], progress:{}, marks:[], settings:{} });
let DB = blank();

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      DB = Object.assign(blank(), p);
    }
  } catch(e){ DB = blank(); }
}
let saveTimer = 0;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){ /* 保存できなくても動かす */ }
  }, 60);
}
function getMaterial(id){ return DB.materials.find(m => m.id === id) || null; }
function upsertMaterial(m){
  const i = DB.materials.findIndex(x => x.id === m.id);
  if (i >= 0) DB.materials[i] = m; else DB.materials.unshift(m);
  save();
}
function deleteMaterial(id){
  DB.materials = DB.materials.filter(m => m.id !== id);
  delete DB.progress[id];
  DB.marks = DB.marks.filter(k => k.materialId !== id);
  save();
}
function progressOf(id){
  if (!DB.progress[id]) DB.progress[id] = { readSentenceIds:[], learnedVocabIds:[], lastSentenceId:"", sessions:0 };
  return DB.progress[id];
}

function settings(){

/* ============================================================
   2. 文分割
   原文を一字も変えないため、AI ではなくここで割る。
   ============================================================ */
const ABBR = new Set(["mr","mrs","ms","dr","prof","sr","jr","st","mt","vs","etc","e.g","i.e","cf",
  "approx","dept","est","inc","ltd","co","corp","univ","fig","no","vol","jan","feb","mar","apr",
  "jun","jul","aug","sep","sept","oct","nov","dec","mon","tue","wed","thu","fri","sat","sun",
  "a.m","p.m","u.s","u.k","u.n","ph.d","b.a","m.a"]);

function normalizeText(raw){
  return String(raw)
    .replace(/\r\n?/g,"\n")
    .replace(/ /g," ")
    .replace(/[ \t]+/g," ")
    .replace(/\n{3,}/g,"\n\n")
    .split("\n").map(l => l.trim()).join("\n")
    .trim();
}
function hasOpenQuote(text){
  let straight=0, open=0, close=0;
  for (const ch of text){
    if (ch === '"') straight++;
    else if (ch === "“") open++;
    else if (ch === "”") close++;
  }
  return straight % 2 === 1 || open > close;
}
function splitParagraph(par){
  const out = []; let buf = "";
  for (let i=0;i<par.length;i++){
    const ch = par[i];
    buf += ch;
    if (ch !== "." && ch !== "!" && ch !== "?") continue;

    let j = i+1;
    while (j < par.length && /[.!?]/.test(par[j])) { buf += par[j]; j++; }
    while (j < par.length && /["'”’)\]]/.test(par[j])) { buf += par[j]; j++; }

    // 閉じていない引用符の中は会話文の途中なので割らない
    if (buf.length < 200 && hasOpenQuote(buf)) { i = j-1; continue; }

    const next = par.slice(j);
    if (next.trim() === ""){ i = j-1; out.push(buf.trim()); buf=""; continue; }
    if (!/^\s+["'“‘(\[]?[A-Z0-9]/.test(next)){ i = j-1; continue; }

    const tail = buf.replace(/[.!?"'”’)\]]+$/,"");
    const lastWord = (tail.split(/[\s(]/).pop() || "").toLowerCase();
    if (ch === "." && ABBR.has(lastWord)){ i = j-1; continue; }
    if (ch === "." && /(^|\s)[A-Za-z]$/.test(tail)){ i = j-1; continue; }
    if (ch === "." && /\d$/.test(tail) && /^\s*\d/.test(next)){ i = j-1; continue; }

    i = j-1; out.push(buf.trim()); buf = "";
  }
  if (buf.trim()) out.push(buf.trim());
  return out.filter(s => s.length > 0);
}
function countWords(text){
  const m = String(text).match(/[A-Za-z0-9'’-]+/g);
  return m ? m.length : 0;
}
function segment(raw){
  const text = normalizeText(raw);
  const paragraphs = text.split(/\n\s*\n|\n/).map(p => p.trim()).filter(p => p.length > 0);
  const sentences = [], paragraphOf = [];
  paragraphs.forEach((par, pi) => {
    for (const s of splitParagraph(par)){ sentences.push(s); paragraphOf.push(pi); }
  });
  return { sentences, paragraphOf, paragraphCount: paragraphs.length, wordCount: countWords(text) };
}
function chunkList(items, size){
  const out = [];
  for (let i=0;i<items.length;i+=size) out.push(items.slice(i,i+size));
  return out;
}

/* ============================================================
   3. 教材の組み立て
   AI の返答が欠けていても（対訳なしでも）1 冊として成立させる。
   ============================================================ */
function normalizeParts(raw, total){
  const sorted = raw.map(p => ({
      title: p.title || "", summary: p.summary || "",
      startSentence: clamp(Math.round(p.startSentence), 1, total),
      endSentence: clamp(Math.round(p.endSentence), 1, total)
    }))
    .filter(p => p.endSentence >= p.startSentence)
    .sort((a,b) => a.startSentence - b.startSentence);
  if (!sorted.length) return [{ startSentence:1, endSentence:total, title:"本文", summary:"" }];

  const out = []; let cursor = 1;
  for (const p of sorted){
    const start = Math.max(cursor, p.startSentence);
    if (start > total) break;
    const end = Math.max(start, p.endSentence);
    out.push({ title:p.title, summary:p.summary, startSentence:start, endSentence:Math.min(end,total) });
    cursor = Math.min(end,total) + 1;
  }
  if (!out.length) return [{ startSentence:1, endSentence:total, title:"本文", summary:"" }];
  out[out.length-1].endSentence = total;
  return out;
}
function fallbackParts(paragraphOf, total){
  if (total === 0) return [];
  const parts = []; let current = paragraphOf[0]; let start = 1;
  for (let i=1;i<=total;i++){
    const p = paragraphOf[i-1];
    if (p !== current){
      parts.push({ startSentence:start, endSentence:i-1, title:"パート"+(parts.length+1), summary:"" });
      current = p; start = i;
    }
  }
  parts.push({ startSentence:start, endSentence:total, title:"パート"+(parts.length+1), summary:"" });
  if (parts.length > 8){
    const merged = [];
    for (let i=1;i<=total;i+=5){
      merged.push({ startSentence:i, endSentence:Math.min(i+4,total), title:"パート"+(merged.length+1), summary:"" });
    }
    return merged;
  }
  return parts;
}
function findFirstSentenceWith(sentences, word){
  const stem = (String(word).toLowerCase().split(/\s+/)[0] || "").replace(/[^a-z'-]/g,"");
  if (!stem) return -1;
  return sentences.findIndex(s => s.toLowerCase().includes(stem));
}
function deriveTitle(sentences){
  const first = sentences[0] || "Untitled";
  return first.split(/\s+/).slice(0,7).join(" ").replace(/[.,;:!?]+$/,"") || "Untitled";
}
function buildMaterial(input){
  const seg = segment(input.text);
  const id = input.id || newId("m");
  const rawParts = (input.parts && input.parts.length)
    ? normalizeParts(input.parts, seg.sentences.length)
    : fallbackParts(seg.paragraphOf, seg.sentences.length);

  const parts = rawParts.map((p,i) => ({
    id: id+"_p"+(i+1), index:i,
    title: (p.title||"").trim() || ("パート"+(i+1)),
    summary: (p.summary||"").trim(),
    sentenceIds: []
  }));

  const sentences = seg.sentences.map((en,i) => {
    let pi = rawParts.findIndex(p => i+1 >= p.startSentence && i+1 <= p.endSentence);
    const part = parts[pi >= 0 ? pi : parts.length-1];
    const s = {
      id: id+"_s"+(i+1), index:i, en,
      ja: ((input.translations && input.translations.get(i+1)) || "").trim(),
      partId: part.id
    };
    part.sentenceIds.push(s.id);
    return s;
  });

  const usedParts = parts.filter(p => p.sentenceIds.length > 0);
  usedParts.forEach((p,i) => { p.index = i; });

  const vocab = (input.vocab || []).map((v,i) => {
    const n = v.sentenceNumber;
    const si = (n && n >= 1 && n <= sentences.length) ? n-1 : findFirstSentenceWith(seg.sentences, v.word);
    const host = si >= 0 ? sentences[si] : undefined;
    return {
      id: id+"_v"+(i+1),
      word: String(v.word||"").trim(),
      phonetic: String(v.phonetic||"").trim(),
      pos: String(v.pos||"").trim(),
      meaning: String(v.meaning||"").trim(),
      example: host ? host.en : "",
      exampleJa: String(v.exampleJa||"").trim() || (host ? host.ja : ""),
      sentenceId: host ? host.id : ""
    };
  });

  return {
    id,
    title: (input.title||"").trim() || deriveTitle(seg.sentences),
    titleJa: (input.titleJa||"").trim(),
    summary: (input.summary||"").trim(),
    level: input.level || "unknown",
    tags: input.tags || [],
    wordCount: seg.wordCount || countWords(input.text),
    source: input.source,
    createdAt: input.createdAt || Date.now(),
    parts: usedParts, sentences, vocab,
    aiGenerated: !!input.aiGenerated,
    notice: input.notice || ""
  };
}

/* ============================================================
   4. 読み上げ（Web Speech API）
   ブラウザ内蔵の音声なので鍵も通信も要らない。
   ============================================================ */
const tts = {
  supported(){ return typeof window !== "undefined" && "speechSynthesis" in window; },
  voices(){
    if (!tts.supported()) return [];
    return speechSynthesis.getVoices()
      .filter(v => v.lang.toLowerCase().startsWith("en"))
      .sort((a,b) => {
        if (a.default !== b.default) return a.default ? -1 : 1;
        if (a.localService !== b.localService) return a.localService ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
  },
  cancel(){ if (tts.supported()) speechSynthesis.cancel(); },
  speak(text, opts){
    if (!tts.supported()){ opts.onError && opts.onError("このブラウザは音声合成に対応していません。"); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = opts.rate; u.lang = "en-US";
    if (opts.voiceURI){
      const v = speechSynthesis.getVoices().find(x => x.voiceURI === opts.voiceURI);
      if (v){ u.voice = v; u.lang = v.lang; }
    }
    u.onend = () => opts.onEnd && opts.onEnd();
    u.onerror = (e) => {
      // 停止操作でも error が飛ぶブラウザがあるので区別する
      if (e.error === "canceled" || e.error === "interrupted") return;
      opts.onError && opts.onError(e.error || "音声の再生に失敗しました。");
    };
    // Chrome は cancel 直後の speak を取りこぼすことがある
    setTimeout(() => speechSynthesis.speak(u), 0);
  }
};

   5. Claude に頼む部分
   ページから claude.use("sample") で直接尋ねる。API キーは要らない。
   使えないときは null が返るので、その場合は対訳なしの取り込みに落とす。
   ============================================================ */
let AI = null;          // 解決済みの sample 関数
let aiState = "pending"; // pending | ready | off
const aiWaiters = [];

async function initAI(){
  try {
    AI = (typeof claude !== "undefined" && claude.use) ? await claude.use("sample") : null;
  } catch(e){ AI = null; }
  aiState = AI ? "ready" : "off";
  aiWaiters.splice(0).forEach(fn => fn());
  document.body.classList.toggle("ai-off", !AI);
  if (currentView === "create") renderCreate();
}

function whenAIKnown(){
  if (aiState !== "pending") return Promise.resolve(aiState);
  return new Promise(res => aiWaiters.push(() => res(aiState)));
}

const META_SYSTEM = `あなたは日本人の英語学習者向けに音読・シャドーイング教材を作る編集者です。

- 重要語は、その文脈での意味を書きます。辞書の第一義をそのまま写さないでください。10〜14 語ほど選びます。

学習者が「ここが分からない」と印を付けた箇所について、その場で短く解説します。

  - 文法・構文がわからない: 文の骨格（S/V/O）を示し、どの語がどこに掛かるかを説明する。

function numbered(list){ return list.map(x => x.n + ". " + x.en).join("\n"); }

/** sample.json を呼んで、失敗時は日本語のメッセージに変える。 */
async function ask(system, user, tier){
  if (!AI) throw new Error("この画面では AI 機能が使えません。");
  try {
    const out = await AI.json(
      [{ role:"user", content: system + "\n\n----\n\n" + user }],
      { modelTier: tier || "default" }
    );
    if (!out || typeof out !== "object") throw new Error("shape");
    return out;
  } catch(e){
    const code = e && e.code;
    if (code === "not_granted") throw new Error("AI の利用が許可されませんでした。対訳なしで取り込むことはできます。");
    if (code === "rate_limited") throw new Error("立て込んでいます。少し待ってからもう一度お試しください。");
    if (code === "cancelled") throw new Error("中止しました。");
    throw new Error("AI の返答を読み取れませんでした。もう一度お試しください。");
  }
}

/** 英文を 1 冊の教材にする。meta と対訳を同時に走らせる。 */
async function analyzeWithAI(text, onStep){
  const seg = segment(text);
  if (!seg.sentences.length) throw new Error("英文が見つかりませんでした。");

  const numberedAll = seg.sentences.map((en,i) => ({ en, n:i+1 }));
  const groups = chunkList(numberedAll, TRANSLATE_CHUNK);
  onStep && onStep("meta", "run");
  onStep && onStep("trans", "run");

  const metaP = ask(META_SYSTEM,
    "次の英文を解析してください。全 " + seg.sentences.length + " 文です。\n\n" + numbered(numberedAll),
    "complex"
  ).then(r => { onStep && onStep("meta","ok"); return r; });

  let doneGroups = 0;
  const transP = groups.map(g =>
    ask(TRANSLATE_SYSTEM,
      "次の " + g.length + " 文を訳してください。番号は本文全体の通し番号です。\n\n" + numbered(g),
      "default"
    ).then(r => {
      doneGroups++;
      onStep && onStep("trans", doneGroups >= groups.length ? "ok" : "run", doneGroups + "/" + groups.length);
      return r;
    })
  );

  const results = await Promise.all([metaP].concat(transP));
  const meta = results[0] || {};
  const translations = new Map();
  for (let i=1;i<results.length;i++){
    const list = (results[i] && results[i].translations) || [];
    for (const t of list){
      const n = Number(t.n);
      if (n >= 1 && n <= seg.sentences.length && t.ja) translations.set(n, String(t.ja));
    }
  }
  onStep && onStep("build","ok");

  return buildMaterial({
    text, source:"paste",
    title: meta.titleEn, titleJa: meta.titleJa, summary: meta.summaryJa,
    level: LEVEL_LABEL[meta.level] ? meta.level : "unknown",
    tags: Array.isArray(meta.tags) ? meta.tags.slice(0,5) : [],
    translations,
    parts: Array.isArray(meta.parts) ? meta.parts : [],
    vocab: Array.isArray(meta.vocab) ? meta.vocab : [],
    aiGenerated: true
  });
}

/** 対訳なしの取り込み。分割・パート・語数だけは AI なしでも出る。 */
function analyzeOffline(text, notice){

  });

/** 弱点マーク 1 件に解説を付ける。 */
async function explainMark(mark, material){
  const s = material ? material.sentences.find(x => x.id === mark.sentenceId) : null;
  const before = s && s.index > 0 ? material.sentences[s.index-1].en : "";
  const after  = s && material && s.index < material.sentences.length-1 ? material.sentences[s.index+1].en : "";
  const focus = mark.selectedText.trim()
    ? '学習者が選んだ箇所: "' + mark.selectedText.trim() + '"'
    : "学習者は文全体に印を付けています。";
  const user = "つまずきの種類: " + WEAKNESS_LABEL[mark.kind] + "\n\n"
    + "対象の文: " + mark.sentenceEn + "\n"
    + "その訳: " + (mark.sentenceJa || "(訳なし)") + "\n"
    + focus + "\n\n"
    + "前後の文:\n" + (before || "(なし)") + "\n" + (after || "(なし)");
  const r = await ask(EXPLAIN_SYSTEM, user, "default");
  return {
    headline: String(r.headline || ""),
    explanation: String(r.explanation || ""),
    keyPoints: Array.isArray(r.keyPoints) ? r.keyPoints.map(String) : [],
    relatedExample: String(r.relatedExample || ""),
    relatedExampleJa: String(r.relatedExampleJa || "")
  };
}

      if (b) b.disabled = !ok;

  }

    upsertMaterial(m); createText = ""; createSteps = {}; createError = "";

  };

async function runAI(){
  createBusy = true; createError = ""; createSteps = { meta:"wait", trans:"wait", build:"wait" };
  renderCreate();
  try {
    const m = await analyzeWithAI(createText, (k, st, note) => {
      createSteps[k] = st;
      if (note) createSteps[k+"_note"] = note;
      if (currentView === "create") renderCreate();
    });
    upsertMaterial(m);
    createBusy = false; createText = ""; createSteps = {};
    go("study", m.id);
  } catch(e){
    createBusy = false;
    createSteps = {};
    createError = (e && e.message) || "教材を作れませんでした。";
    renderCreate();
  }
}

/* ============================================================
   9. 音読プレイヤーの状態機械
   再生のたびに token を進め、古い onEnd を無効にする。
   設定はその場で読むので、再生中に変えても次の文から効く。
   ============================================================ */
const reader = {
  token: 0, index: 0, playing: false, error: "",
  sentences: [], range: [0,0],
  onSentenceDone: null,

  attach(sentences){
    this.sentences = sentences;
    this.index = 0;
    this.range = [0, Math.max(0, sentences.length-1)];
    this.error = "";
  },
  stop(){ this.token++; tts.cancel(); this.playing = false; paintReader(); },
  playFrom(start){
    this.token++;
    const token = this.token;
    this.error = "";
    this.playing = true;
    const self = this;

    function run(i, repeatDone){
      if (self.token !== token) return;
      const s = self.sentences[i];
      if (!s){ self.playing = false; paintReader(); return; }
      self.index = i;
      paintReader();
      const st = settings();
      tts.speak(s.en, {
        rate: st.rate,
        voiceURI: st.voiceURI || undefined,
        onEnd(){
          if (self.token !== token) return;
          const c = settings();
          const repeats = repeatDone + 1;
          if (repeats >= c.repeat && self.onSentenceDone) self.onSentenceDone(s);
          if (repeats < c.repeat){ run(i, repeats); return; }
          if (!c.autoAdvance){ self.playing = false; paintReader(); return; }
          const lo = self.range[0], hi = self.range[1];
          const next = i + 1;
          if (next > hi || next >= self.sentences.length){
            if (c.loop){ run(Math.max(0, lo), 0); return; }
            self.playing = false; paintReader(); return;
          }
          run(next, 0);
        },
        onError(reason){
          if (self.token !== token) return;
          self.playing = false;
          self.error = reason;
          paintReader();
        }
      });
    }
    run(start, 0);
  },
  toggle(){ if (this.playing) this.stop(); else this.playFrom(this.index); },
  step(delta){
    const next = clamp(this.index + delta, 0, Math.max(0, this.sentences.length-1));
    if (this.playing) this.playFrom(next);
    else { this.index = next; paintReader(); scrollToCurrent(); }
  }
};

let studyTab = "text";
const revealed = new Set();      // 個別に「訳を見る」を押した文
const selCache = new Map();      // 文 id → ドラッグで選んだ文字列
let openMenu = "";

function markChip(k){
  return '<a class="chip k-' + k.kind + '" href="#mark-' + esc(k.id) + '" data-jump="' + esc(k.id) + '">'
    + esc(WEAKNESS_SHORT[k.kind])
    + (k.status === "loading" ? " …" : k.status === "done" ? " ✓" : "")
    + "</a>";
}
function rowHTML(m, s, pr, marks){
  const n = s.index + 1;
  const isRead = pr.readSentenceIds.indexOf(s.id) >= 0;
  const cur = reader.index === s.index;
  const jaVisible = settings().showJa || revealed.has(s.id);
  const mine = marks.filter(k => k.sentenceId === s.id);

    + '<div class="sent' + (cur ? " cur" : "") + (isRead ? " done" : "") + '" id="sentence-' + esc(s.id) + '">'
    +   '<button type="button" class="no num" data-play="' + esc(s.id) + '" title="この文から再生" aria-label="'
    +     n + "文目から再生\">" + n + "</button>"

    +     '<p class="txt" data-txt="' + esc(s.id) + '">' + esc(s.en) + "</p>"
    +     (s.ja
        ? (jaVisible
            ? '<p class="ja">' + esc(s.ja) + "</p>"
            : '<button type="button" class="reveal" data-reveal="' + esc(s.id) + '">訳を見る</button>')
        : "")
    +     (mine.length ? '<div class="marks">' + mine.map(markChip).join("") + "</div>" : "")
    +   "</div>"
    +   '<div class="acts">'
    +     '<button type="button" class="' + (isRead ? "read" : "") + '" data-read="' + esc(s.id) + '" aria-pressed="'
    +       (isRead ? "true" : "false") + '" title="' + (isRead ? "音読チェックを外す" : "音読できた") + '">読めた</button>'

    +       '<button type="button" data-menu="' + esc(s.id) + '" title="分からないところに印を付ける" aria-expanded="'
    +         (openMenu === s.id ? "true" : "false") + '">？</button>'
    +       (openMenu === s.id ? menuHTML(s) : "")

    +   "</div>"
    + "</div>";
}
function menuHTML(s){
  const sel = selCache.get(s.id) || "";

    + "<p>" + (sel ? "「" + esc(truncate(sel,22)) + "」について" : "この文のどこが分からない？") + "</p>"

        + esc(WEAKNESS_LABEL[k]) + "</button>").join("")

}

    +     '<input type="checkbox" id="showJa"' + (settings().showJa ? " checked" : "") + " style=\"accent-color:var(--primary)\"> 訳を全部出す</label>"
    + "</div>"

    +     m.sentences.length + "</span></button>"

    +     m.vocab.length + "</span></button>"

    +     unresolved + "</span></button>"

function renderTab(m){
  const box = $("#tabbody");
  if (!box) return;
  if (studyTab === "text") renderText(m, box);
  else if (studyTab === "vocab") renderVocab(m, box);
  else renderMarkList(m, box);
}

/* ---------- 本文タブ ---------- */
function renderText(m, box){
  const pr = progressOf(m.id);
  const marks = marksOf(m.id);
  box.innerHTML = '<div id="sentences">' + m.parts.map((p,i) => ''
    + '<section class="part">'
    +   '<div class="part-head"><span class="pn">P' + (i+1) + "</span><span><b>" + esc(p.title) + "</b>"
    +     (p.summary ? '<span class="s">' + esc(p.summary) + "</span>" : "") + "</span></div>"
    +   p.sentenceIds.map(sid => {
          const s = m.sentences.find(x => x.id === sid);
          return s ? rowHTML(m, s, pr, marks) : "";
        }).join("")
    + "</section>").join("") + "</div>";

  const cont = $("#sentences");
  const capture = () => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) return;
    const text = sel.toString().trim();
    if (!text) return;
    let node = sel.anchorNode;
    while (node && node !== cont){
      if (node.nodeType === 1 && node.dataset && node.dataset.txt){
        selCache.set(node.dataset.txt, text);
        return;
      }
      node = node.parentNode;
    }
  };
  cont.addEventListener("mouseup", capture);
  cont.addEventListener("touchend", capture);

  cont.onclick = (e) => {
    const t = e.target;
    const play = t.closest("[data-play]");
    if (play){ reader.playFrom(m.sentences.findIndex(s => s.id === play.dataset.play)); return; }

    const rev = t.closest("[data-reveal]");
    if (rev){ revealed.add(rev.dataset.reveal); patchRow(m, rev.dataset.reveal); return; }

    const rd = t.closest("[data-read]");
    if (rd){
      const pr2 = progressOf(m.id);
      const id = rd.dataset.read;
      const i = pr2.readSentenceIds.indexOf(id);
      if (i >= 0) pr2.readSentenceIds.splice(i,1); else pr2.readSentenceIds.push(id);
      save(); patchRow(m, id); refreshProgressBar(m);
      return;
    }
    const mn = t.closest("[data-menu]");
    if (mn){
      const id = mn.dataset.menu;
      const was = openMenu;
      openMenu = (was === id) ? "" : id;
      if (was) patchRow(m, was);
      if (openMenu) patchRow(m, openMenu);
      return;
    }
    const mk = t.closest("[data-mark]");
    if (mk){
      const sid = mk.dataset.sid;
      openMenu = "";
      addMark(m, sid, mk.dataset.mark, selCache.get(sid) || "");
      selCache.delete(sid);
      patchRow(m, sid);
      refreshMarkBadge(m);
      return;
    }
    const jump = t.closest("[data-jump]");
    if (jump){
      e.preventDefault();
      studyTab = "marks";
      $("#tabs").querySelectorAll("[data-tab]").forEach(x =>
        x.setAttribute("aria-current", String(x.dataset.tab === "marks")));
      renderTab(m);
      const el = document.getElementById("mark-" + jump.dataset.jump);
      if (el) el.scrollIntoView({ behavior:"smooth", block:"center" });
      return;
    }
    if (openMenu && !t.closest(".pop")){ const was = openMenu; openMenu = ""; patchRow(m, was); }
  };
}
function patchRow(m, sid){
  const el = document.getElementById("sentence-" + sid);
  if (!el) return;
  const s = m.sentences.find(x => x.id === sid);
  if (!s) return;
  el.outerHTML = rowHTML(m, s, progressOf(m.id), marksOf(m.id));
}
function refreshProgressBar(m){
  const pr = progressOf(m.id);
  const read = pr.readSentenceIds.length;
  const pct = m.sentences.length ? Math.round(read/m.sentences.length*100) : 0;
  const bar = viewEl().querySelector(".bar i");
  if (bar) bar.style.width = pct + "%";
  const label = viewEl().querySelector(".row .tiny.muted.num");
  if (label) label.textContent = "音読 " + read + "/" + m.sentences.length;
}
function paintReader(){
  if (currentView !== "study") return;
  document.querySelectorAll("#sentences .sent").forEach(el => {
    const on = el.id === "sentence-" + (reader.sentences[reader.index] || {}).id;
    el.classList.toggle("cur", on);
    el.classList.toggle("speaking", on && reader.playing);
    const no = el.querySelector(".no");
    if (no) no.setAttribute("aria-current", String(on));
  });
  const pb = $("#playBtn");
  if (pb) pb.textContent = reader.playing ? "■" : "▶";
  if (pb) pb.setAttribute("aria-label", reader.playing ? "停止" : "再生");
  const pos = $("#pos");
  if (pos) pos.textContent = (reader.index+1) + " / " + reader.sentences.length;
  const err = $("#ttsErr");
  if (err){ err.textContent = reader.error || ""; err.hidden = !reader.error; }
}
function scrollToCurrent(){
  const s = reader.sentences[reader.index];
  if (!s) return;
  const el = document.getElementById("sentence-" + s.id);
  if (el) el.scrollIntoView({ behavior:"smooth", block:"center" });
}

function refreshMarkBadge(m){
  const badge = viewEl().querySelector('[data-tab="marks"] .count');
  if (badge) badge.textContent = marksOf(m.id).filter(k => !k.resolved).length;
}

/* ---------- プレイヤー ---------- */
function renderPlayer(m){
  const st = settings();
  const total = m.sentences.length;
  const whole = reader.range[0] === 0 && reader.range[1] >= total-1;

  playerSlot().innerHTML = ''
    + '<div class="player"><div class="player-in">'
    +   '<p id="ttsErr" class="tiny" style="color:var(--danger);margin:0 0 7px" hidden></p>'
    +   (tts.supported() ? "" : '<p class="tiny" style="color:var(--marker);margin:0 0 7px">'
        + "このブラウザは音声合成に対応していません。Chrome / Edge / Safari でお試しください。</p>")
    +   '<div class="main">'
    +     '<button type="button" class="skip" id="prev" aria-label="前の文">◀◀</button>'
    +     '<button type="button" class="play" id="playBtn" aria-label="再生">▶</button>'
    +     '<button type="button" class="skip" id="next" aria-label="次の文">▶▶</button>'
    +     '<span class="pos" id="pos">1 / ' + total + "</span>"
    +     '<label style="margin-left:auto">速さ<select id="rate">'
    +       RATE_STEPS.map(r => '<option value="' + r + '"' + (r === st.rate ? " selected" : "") + ">"
            + r.toFixed(2) + "x</option>").join("") + "</select></label>"
    +     "<label>回数<select id=\"repeat\">"
    +       [1,2,3,5].map(n => '<option value="' + n + '"' + (n === st.repeat ? " selected" : "") + ">"
            + n + "回</option>").join("") + "</select></label>"
    +   "</div>"
    +   '<div class="opts">'
    +     '<label><input type="checkbox" id="adv"' + (st.autoAdvance ? " checked" : "") + "> 次の文へ進む</label>"
    +     '<label><input type="checkbox" id="loop"' + (st.loop ? " checked" : "") + "> 範囲をくり返す</label>"
    +     '<span class="rng"><span>範囲</span>'
    +       '<button type="button" data-range="all" aria-pressed="' + whole + '">全文</button>'
    +       m.parts.map((p,i) => '<button type="button" data-range="' + esc(p.id) + '" aria-pressed="'
            + (!whole && isPartRange(m,p)) + '">P' + (i+1) + "</button>").join("")
    +     "</span>"
    +     '<span id="voiceSlot"></span>'
    +   "</div>"
    + "</div></div>";

  $("#playBtn").onclick = () => { reader.toggle(); if (reader.playing) scrollToCurrent(); };
  $("#prev").onclick = () => reader.step(-1);
  $("#next").onclick = () => reader.step(1);
  $("#rate").onchange = (e) => { settings().rate = Number(e.target.value); save(); };
  $("#repeat").onchange = (e) => { settings().repeat = Number(e.target.value); save(); };
  $("#adv").onchange = (e) => { settings().autoAdvance = e.target.checked; save(); };
  $("#loop").onchange = (e) => { settings().loop = e.target.checked; save(); };
  playerSlot().querySelectorAll("[data-range]").forEach(b => {
    b.onclick = () => {
      const key = b.dataset.range;
      if (key === "all") reader.range = [0, Math.max(0, total-1)];
      else {
        const p = m.parts.find(x => x.id === key);
        if (p){
          const first = m.sentences.findIndex(s => s.id === p.sentenceIds[0]);
          const last = m.sentences.findIndex(s => s.id === p.sentenceIds[p.sentenceIds.length-1]);
          reader.range = [first, last];
          reader.index = first;
        }
      }
      renderPlayer(m); paintReader(); scrollToCurrent();
    };
  });
  mountVoicePicker();
  paintReader();
}
function isPartRange(m, p){
  const first = m.sentences.findIndex(s => s.id === p.sentenceIds[0]);
  const last = m.sentences.findIndex(s => s.id === p.sentenceIds[p.sentenceIds.length-1]);
  return reader.range[0] === first && reader.range[1] === last;
}
/** 声の一覧は非同期に届くブラウザがあるので、届いてから差し込む。 */
function mountVoicePicker(){
  const slot = $("#voiceSlot");
  if (!slot) return;
  const draw = () => {
    const vs = tts.voices();
    const here = $("#voiceSlot");
    if (!here || vs.length < 2) return;
    const cur = settings().voiceURI;
    here.innerHTML = "<label>声<select id=\"voice\" style=\"max-width:9.5rem\">"
      + '<option value="">既定</option>'
      + vs.map(v => '<option value="' + esc(v.voiceURI) + '"' + (v.voiceURI === cur ? " selected" : "") + ">"
          + esc(v.name) + "</option>").join("")
      + "</select></label>";
    $("#voice").onchange = (e) => { settings().voiceURI = e.target.value; save(); };
  };
  draw();
  if (tts.supported()) speechSynthesis.addEventListener("voiceschanged", draw, { once:true });
}

/* ---------- 重要語タブ ---------- */
function renderVocab(m, box){
  const pr = progressOf(m.id);
  if (!m.vocab.length){
    box.innerHTML = '<div class="empty">この教材には重要語がありません。'
      + (m.aiGenerated ? "" : "対訳なしで取り込んだ教材には語義が付きません。") + "</div>";
    return;
  }
  box.innerHTML = '<div class="vlist">' + m.vocab.map(v => {
    const learned = pr.learnedVocabIds.indexOf(v.id) >= 0;
    return '<article class="v">'
      + '<div style="flex:1;min-width:0">'
      +   '<div class="row" style="gap:7px">'
      +     '<span class="word">' + esc(v.word) + "</span>"
      +     (v.phonetic ? '<span class="ph">' + esc(v.phonetic) + "</span>" : "")
      +     (v.pos ? '<span class="chip">' + esc(v.pos) + "</span>" : "")
      +   "</div>"
      +   '<div class="mean">' + esc(v.meaning) + "</div>"
      +   (v.example ? '<div class="ex">' + esc(v.example)
          + (v.exampleJa ? '<span class="exja">' + esc(v.exampleJa) + "</span>" : "") + "</div>" : "")
      + "</div>"
      + '<div class="side">'
      +   '<button type="button" class="chip" data-say="' + esc(v.word) + '" title="読み上げる">♪</button>'
      +   '<button type="button" class="chip' + (learned ? " learned" : "") + '" data-learn="' + esc(v.id) + '">'
      +     (learned ? "覚えた ✓" : "覚えた") + "</button>"
      + "</div>"
      + "</article>";
  }).join("") + "</div>"
  + '<p class="tiny muted" style="margin-top:12px">覚えた語は ✓ が付きます。用例は本文のその文です。</p>';

  box.onclick = (e) => {
    const say = e.target.closest("[data-say]");
    if (say){ reader.stop(); tts.speak(say.dataset.say, { rate: settings().rate }); return; }
    const lr = e.target.closest("[data-learn]");
    if (lr){
      const id = lr.dataset.learn;
      const i = pr.learnedVocabIds.indexOf(id);
      if (i >= 0) pr.learnedVocabIds.splice(i,1); else pr.learnedVocabIds.push(id);
      save();
      lr.classList.toggle("learned", pr.learnedVocabIds.indexOf(id) >= 0);
      lr.textContent = pr.learnedVocabIds.indexOf(id) >= 0 ? "覚えた ✓" : "覚えた";
    }
  };
}

/* ============================================================
   11. 弱点マーク
   印を付けたらその場で解説を頼み、弱点ノートに残す。
   ============================================================ */
function addMark(m, sid, kind, selectedText){
  const s = m.sentences.find(x => x.id === sid);
  if (!s) return;
  const mark = {
    id: newId("k"), materialId: m.id, materialTitle: m.title,
    sentenceId: s.id, sentenceEn: s.en, sentenceJa: s.ja,
    kind, selectedText: selectedText || "",
    explanation: null,
    status: AI ? "loading" : "idle",
    errorMessage: "", createdAt: Date.now(), resolved: false
  };
  DB.marks.unshift(mark);
  save();
  if (AI) runExplain(mark.id);
}
async function runExplain(markId){
  const mark = DB.marks.find(k => k.id === markId);
  if (!mark) return;
  mark.status = "loading"; mark.errorMessage = "";
  save(); repaintMark(markId);
  try {
    mark.explanation = await explainMark(mark, getMaterial(mark.materialId));
    mark.status = "done";
  } catch(e){
    mark.status = "error";
    mark.errorMessage = (e && e.message) || "解説を取得できませんでした。";
  }
  save(); repaintMark(markId);
}
function repaintMark(markId){
  const el = document.getElementById("mark-" + markId);
  const mark = DB.marks.find(k => k.id === markId);
  if (el && mark){ el.outerHTML = markHTML(mark, el.dataset.ctx === "note"); }
  // 本文タブのチップ（… → ✓）も追いつかせる
  if (mark && currentView === "study" && studyTab === "text"){
    const m = getMaterial(mark.materialId);
    if (m) patchRow(m, mark.sentenceId);
  }
  const badge = $("#tabs") && $("#tabs").querySelector('[data-tab="marks"] .count');
  if (badge && currentView === "study"){
    badge.textContent = marksOf(currentMaterialId).filter(k => !k.resolved).length;
  }
}
/** 選んだ箇所を文の中で目立たせる。 */
function highlighted(en, sel){
  if (!sel) return esc(en);
  const i = en.indexOf(sel);
  if (i < 0) return esc(en);
  return esc(en.slice(0,i)) + '<span class="hl">' + esc(sel) + "</span>" + esc(en.slice(i+sel.length));
}
function markHTML(k, showMaterial){
  const e = k.explanation;
  return '<article class="mark' + (k.resolved ? " res" : "") + '" id="mark-' + esc(k.id) + '" data-ctx="'
    + (showMaterial ? "note" : "study") + '">'
    + '<div class="row" style="gap:7px">'
    +   '<span class="chip k-' + k.kind + '">' + esc(WEAKNESS_LABEL[k.kind]) + "</span>"
    +   (showMaterial ? '<button type="button" class="chip" data-open="' + esc(k.materialId) + '">'
        + esc(truncate(k.materialTitle, 20)) + "</button>" : "")
    +   '<span class="tiny muted" style="margin-left:auto">' + esc(ago(k.createdAt)) + "</span>"
    + "</div>"
    + '<p class="q">' + highlighted(k.sentenceEn, k.selectedText) + "</p>"
    + (k.sentenceJa ? '<p class="qja">' + esc(k.sentenceJa) + "</p>" : "")
    + (k.status === "loading"
        ? '<p class="tiny muted" style="margin:12px 0 0"><span class="spin"></span> Claude が解説を書いています…</p>' : "")
    + (k.status === "idle"
        ? '<p class="tiny muted" style="margin:12px 0 0">印だけ残しました。' + (AI ? "" : "この画面では AI 解説が使えません。") + "</p>" : "")
    + (k.status === "error" ? '<p class="tiny" style="color:var(--danger);margin:12px 0 0">' + esc(k.errorMessage) + "</p>" : "")
    + (e && k.status === "done"
        ? '<div class="exp">'
          + '<div class="head">' + esc(e.headline) + "</div>"
          + '<div class="b">' + esc(e.explanation) + "</div>"
          + (e.keyPoints.length ? "<ul>" + e.keyPoints.map(p => "<li>" + esc(p) + "</li>").join("") + "</ul>" : "")
          + (e.relatedExample
              ? '<div class="rel"><span class="re">' + esc(e.relatedExample) + "</span>"
                + (e.relatedExampleJa ? '<span class="rj">' + esc(e.relatedExampleJa) + "</span>" : "") + "</div>"
              : "")
          + "</div>"
        : "")
    + '<div class="row" style="margin-top:12px;gap:6px">'
    +   (AI && k.status !== "loading"
        ? '<button type="button" class="chip" data-explain="' + esc(k.id) + '">'
          + (k.status === "done" ? "解説を作り直す" : "解説を取得") + "</button>" : "")
    +   '<button type="button" class="chip' + (k.resolved ? " learned" : "") + '" data-resolve="' + esc(k.id) + '">'
    +     (k.resolved ? "解決済み ✓" : "解決にする") + "</button>"
    +   '<button type="button" class="chip" data-delmark="' + esc(k.id) + '" style="margin-left:auto">削除</button>'
    + "</div>"
    + "</article>";
}
function bindMarkList(root, after){
  root.onclick = (e) => {
    const ex = e.target.closest("[data-explain]");
    if (ex){ runExplain(ex.dataset.explain); return; }
    const rs = e.target.closest("[data-resolve]");
    if (rs){
      const k = DB.marks.find(x => x.id === rs.dataset.resolve);
      if (k){ k.resolved = !k.resolved; save(); after ? after() : repaintMark(k.id); }
      return;
    }
    const dl = e.target.closest("[data-delmark]");
    if (dl){
      DB.marks = DB.marks.filter(x => x.id !== dl.dataset.delmark);
      save();
      after ? after() : (document.getElementById("mark-" + dl.dataset.delmark) || {}).remove?.();
      if (currentView === "study") renderTab(getMaterial(currentMaterialId));
      return;
    }
    const op = e.target.closest("[data-open]");
    if (op){ go("study", op.dataset.open); return; }
  };
}
/* ---------- 学習画面の弱点タブ ---------- */
function renderMarkList(m, box){
  const list = marksOf(m.id).slice().sort((a,b) => Number(a.resolved) - Number(b.resolved) || b.createdAt - a.createdAt);
  box.innerHTML = list.length
    ? '<div class="vlist">' + list.map(k => markHTML(k, false)).join("") + "</div>"
      + '<p class="tiny muted" style="margin-top:12px">本文タブで文の <b>？</b> を押すと印を付けられます。'
      + "先に英文の一部をドラッグして選ぶと、その箇所について解説します。</p>"
    : '<div class="empty">まだ印がありません。<br>本文タブで分からない文の <b>？</b> を押してください。</div>';
  bindMarkList(box, () => renderTab(m));
}

/* ============================================================
   12. 弱点ノート（教材をまたいで見る）
   ============================================================ */
let noteKind = "all";
let noteShowResolved = false;
function renderWeakness(){
  let list = DB.marks.slice().sort((a,b) => b.createdAt - a.createdAt);
  if (noteKind !== "all") list = list.filter(k => k.kind === noteKind);
  if (!noteShowResolved) list = list.filter(k => !k.resolved);

  const counts = { listening:0, vocab:0, grammar:0 };
  DB.marks.filter(k => !k.resolved).forEach(k => { counts[k.kind]++; });
  const top = KINDS.slice().sort((a,b) => counts[b]-counts[a])[0];

  viewEl().innerHTML = ''
    + '<p class="eyebrow">弱点ノート</p>'
    + '<h1 style="margin-bottom:10px">つまずきの置き場</h1>'
    + '<p class="lede" style="margin-bottom:6px">'
    +   (DB.marks.length
        ? "未解決 " + DB.marks.filter(k=>!k.resolved).length + " 件。"
          + (counts[top] ? "いま一番多いのは<b>" + esc(WEAKNESS_LABEL[top]) + "</b>です。" : "")
        : "学習画面で分からない文に印を付けると、ここに教材をまたいで溜まります。")
    + "</p>"
    + '<div class="row" style="margin:18px 0 4px;gap:6px">'
    +   '<div class="seg">'
    +     '<button type="button" data-kind="all" aria-pressed="' + (noteKind==="all") + '">すべて</button>'
    +     KINDS.map(k => '<button type="button" data-kind="' + k + '" aria-pressed="' + (noteKind===k) + '">'
          + esc(WEAKNESS_SHORT[k]) + '<span class="count num" style="margin-left:4px;color:var(--faint)">'
          + counts[k] + "</span></button>").join("")
    +   "</div>"
    +   '<label class="tiny muted" style="margin-left:auto;display:inline-flex;gap:5px;align-items:center;white-space:nowrap">'
    +     '<input type="checkbox" id="showRes"' + (noteShowResolved ? " checked" : "")
    +     ' style="accent-color:var(--primary)"> 解決済みも出す</label>'
    + "</div>"
    + '<div id="notelist">' + (list.length
        ? '<div class="vlist">' + list.map(k => markHTML(k, true)).join("") + "</div>"
        : '<div class="empty">' + (DB.marks.length ? "この条件の弱点はありません。" : "まだ印がありません。") + "</div>") + "</div>";

  viewEl().querySelectorAll("[data-kind]").forEach(b => {
    b.onclick = () => { noteKind = b.dataset.kind; renderWeakness(); };
  });
  $("#showRes").onchange = (e) => { noteShowResolved = e.target.checked; renderWeakness(); };
  bindMarkList($("#notelist"), () => renderWeakness());
}

/* ============================================================
   13. 起動
   ============================================================ */
function seedSamples(){
  const have = new Set(DB.materials.map(m => m.id));
  let added = 0;
  for (const s of SAMPLES){
    if (have.has(s.id)) continue;
    const copy = JSON.parse(JSON.stringify(s));
    copy.createdAt = Date.now() - (copy.daysAgo || 0) * 86400000;
    delete copy.daysAgo;
    copy.notice = "";
    DB.materials.push(copy);
    added++;
  }
  if (added) save();
  return added;
}
document.getElementById("nav").onclick = (e) => {
  const b = e.target.closest("[data-go]");
  if (b) go(b.dataset.go);
};
document.addEventListener("click", (e) => {
  // ヒーローやカードからの遷移（各画面の外側で拾う）
  const go2 = e.target.closest("#view [data-go]");
  if (go2){ go(go2.dataset.go); return; }
  const open = e.target.closest("#view .mat[data-open], #view .hero [data-open]");
  if (open){ go("study", open.dataset.open); }
});
window.addEventListener("pagehide", () => tts.cancel());
document.addEventListener("keydown", (e) => {
  if (currentView !== "study") return;
  if (e.target.matches("input, textarea, select")) return;
  if (e.code === "Space"){ e.preventDefault(); reader.toggle(); if (reader.playing) scrollToCurrent(); }
  else if (e.key === "ArrowRight"){ reader.step(1); }
  else if (e.key === "ArrowLeft"){ reader.step(-1); }
});

load();
seedSamples();
go("home");
initAI();
</script>
